application:
  name: hydra
  pods:
  - name: app
    image: oryd/hydra:v2.2.0
    command: sh -c "until hydra migrate sql -e --yes; do echo waiting-for-db; sleep 3; done && exec hydra serve all --dev"
    path: /
    servicePorts:
    - 4444
    vars:
      DSN: "postgres://hydra:hydraDbPass2026@postgres.pod:5432/hydra?sslmode=disable"
      SECRETS_SYSTEM: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      URLS_SELF_ISSUER: "https://relaxed-weasel-hydra.cloud.nexlayer.ai/"
      URLS_CONSENT: "https://relaxed-weasel-hydra.cloud.nexlayer.ai/consent"
      URLS_LOGIN: "https://relaxed-weasel-hydra.cloud.nexlayer.ai/login"
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: "a1b2c3d4e5f6a1b2"
  - name: postgres
    image: postgres:16-alpine
    servicePorts:
    - 5432
    vars:
      POSTGRES_DB: hydra
      POSTGRES_USER: hydra
      POSTGRES_PASSWORD: hydraDbPass2026
    volumes:
    - name: hydra-db
      mountPath: /var/lib/postgresql/data
      size: 5Gi
