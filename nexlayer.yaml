application:
  name: hydra
  pods:
  - name: app
    image: ghcr.io/ory/hydra:v2.2.0
    path: /health/ready
    servicePorts:
    - 4444
    vars:
      DSN: "sqlite:///data/db.sqlite?_fk=true&_journal=WAL&busy_timeout=10000"
      SECRETS_SYSTEM: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4"
      URLS_SELF_ISSUER: "https://relaxed-weasel-hydra.cloud.nexlayer.ai/"
      OIDC_SUBJECT_IDENTIFIERS_SUPPORTED_TYPES: public
      OIDC_SUBJECT_IDENTIFIERS_PAIRWISE_SALT: "a1b2c3d4e5f6a1b2"
    volumes:
    - name: hydra-data-v2
      mountPath: /data
      size: 2Gi
